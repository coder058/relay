name: Backend, frontend and browser review
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    # GUESS: UNCALIBRATED GUESS — bounded CI runtime, not app performance.
    timeout-minutes: 20
    steps:
      # SOURCE: official action release SHAs resolved through GitHub.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Python API and MCP tests
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          python -m pytest -q
      - name: Frontend build and dependency check
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build
      - name: Browser-to-Python review and export
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
